# Replaces CircleCI build-and-test. Public GitHub repos get GitHub-hosted
# Linux runners at no cost; this is the same Nix flake build + --qa-self-test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package (nix/package.nix via flake.nix)
        run: nix build .#default --print-build-logs

      - name: Headless install/rescan/remove smoke test (--qa-self-test)
        run: nix run .#default -- --qa-self-test
